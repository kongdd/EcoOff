[package]
name = "noeco"
version = "0.1.0"
edition = "2024"

[features]
daemon = []

[dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
